    <h1>Contact Us</h1>
    <a href="index.html">&larr;Back to home</a>
    <hr>
    <fieldset>
        <legend>Personal Details</legend>
        <label for="first-name">First name &ast; </label>
        <br><br>
        <input type="text" placeholder="e.g. John" id="first-name">
        <br><br>
        <label for="last-name">Last Name &ast; </label>
        <br>
        <input type="text" placeholder="e.g. Done" id="last-name">
        <br><br>
        <label for="E-mail">Email &ast; </label>
        <br>
        <input type="email" placeholder="john@example.com" id="E-mail">
        <br><br>
        <label for="phone">phone</label>
        <br>
        <input type="tel" placeholder="+1 234 567 8900" id="phone">
        <br><br>
        <label for="date">Date of Birth</label>
        <br>
        <input type="date" id="date">
        <br><br>
        <label for="websit">Wibsite</label>
        <br>
        <input type="text" placeholder="https://yourwibsite.com" id="websit">
    </fieldset>

    <fieldset>
        <legend>inqiry Datels</legend>
        <br>
        <label for="department">Department &ast; </label>
        <br>
        <select name="" id="">
            <option value="1">--select--</option>
            <option value=""></option>
        </select>
        <br><br>
        <label for="subject">subject &ast;</label>
        <br>
        <input type="text" placeholder="Brife title">
        <br><br>
        <label for="Budget">Budget (USD)</label>
        <br>
        <input type="text" placeholder="e.g. 500">
        <br><br>
        <label for="prefereed">prefereed contact time</label>
        <br>
        <input type="time">
        <br><br>
        <label for="file">Attech File</label>
        <br>
        <input type="file" name="file" id="file">
        <br>
        <small>PDf, PNG or JPG only.</small>
        <br><br>
        <label for="masage">masage &ast;</label>
        <br>
        <textarea name="masage" id="masage" placeholder="Describe your inquiry..." style="width: 250px; height: 80px;"></textarea>
    </fieldset>
    <fieldset>
        <legend>Perferences</legend>
        <b>Preferred contact method:</b>
        <br><br>
        <input type="checkbox" name="perferred" id="perferred-email">

        <br>
        <input type="checkbox" name="perferred" id="perferred-phone">
        <label for="perferred-phone">Phone</label>
        <br><br>
        <b>How did you hear about us?</b>
        <br>
        <input type="radio" name="about" id="Searsh Engine">
        <label for="Searsh Engine">Searsh Engine</label>
        <br>
        <input type="radio" value="Social Media" name="about" id="Social Media">
        <label for="Social Media">Social Media</label>
        <br>
        <input type="radio" value="Friend" name="about" id="Friend">
